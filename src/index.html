<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Twiking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">Twiking</span>
        <span class="brand-sub">mod platform</span>
      </div>
      <div class="titlebar-drag"></div>
      <div class="window-controls">
        <button id="win-min" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <button id="win-max" title="Maximise" aria-label="Maximise">
          <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3" rx="1" /></svg>
        </button>
        <button id="win-close" class="danger" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
      </div>
    </header>

    <div class="main-area">
      <aside class="sidebar">
        <div id="sidebar-nav"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <main class="view" id="view">
        <div class="loading">
          <div class="spinner"></div>
          <p>Reading your desktop…</p>
        </div>
      </main>
    </div>

    <div class="toasts" id="toasts"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
